name: HELE CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - hele-1.0-foundation

permissions:
  contents: read

concurrency:
  group: hele-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure secrets are not tracked
        shell: bash
        run: |
          tracked_env="$(git ls-files '.env' '.env.local' '.env.production' '.env.development' '.env.test')"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files detected:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        if: always()
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: hele-ci-only-secret-not-for-production
          DATABASE_URL: file:/tmp/hele-ci.db
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          TMDB_API_KEY: ci-placeholder
          ADMIN_EMAILS: admin@example.com
