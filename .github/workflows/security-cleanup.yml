name: HELE safe dependency cleanup

on:
  push:
    branches:
      - hele-1.1-security-architecture

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove unused direct packages
        run: npm uninstall @mdxeditor/editor sharp

      - name: Patch vulnerable Prisma tooling transitives
        run: |
          npm pkg set 'overrides.deepmerge-ts=8.0.2'
          npm pkg set 'overrides.effect=3.20.0'
          npm install

      - name: Apply safe audit fixes
        run: npm audit fix || true

      - name: Validate Prisma
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: file:/tmp/hele-security.db

      - name: Quality checks
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: hele-ci-only-secret-not-for-production
          DATABASE_URL: file:/tmp/hele-ci.db
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          TMDB_API_KEY: ci-placeholder
          ADMIN_EMAILS: admin@example.com
          CRON_SECRET: hele-ci-cron-secret-123456789

      - name: Final audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata || {}));
          const vulns = audit.vulnerabilities || {};
          for (const [name, item] of Object.entries(vulns)) {
            if (['critical','high','moderate'].includes(item.severity)) {
              console.log(`AUDIT_VULN ${name} severity=${item.severity} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`);
            }
          }
          NODE

      - name: Prepare validated files
        run: |
          mkdir security-output
          cp package.json package-lock.json audit.json security-output/

      - name: Upload validated files
        uses: actions/upload-artifact@v4
        with:
          name: security-cleanup-output
          path: security-output
          retention-days: 1
