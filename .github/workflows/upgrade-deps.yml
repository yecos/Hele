name: HELE dependency security upgrade

on:
  push:
    branches:
      - hele-1.1-security-architecture

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[deps-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hele-1.1-security-architecture
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade framework and auth security patches
        run: |
          npm install --save-exact next@16.3.6 next-auth@4.24.15 react@19.2.7 react-dom@19.2.7
          npm install --save-exact @prisma/client@6.19.2 prisma@6.19.2 @prisma/adapter-libsql@6.19.2
          npm install --save-dev --save-exact eslint-config-next@16.3.6
          npm uninstall node-cron

      - name: Quality checks
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: hele-ci-only-secret-not-for-production
          DATABASE_URL: file:/tmp/hele-ci.db
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          TMDB_API_KEY: ci-placeholder
          ADMIN_EMAILS: admin@example.com
          CRON_SECRET: hele-ci-cron-secret-123456789

      - name: Audit summary
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata || {}));
          const vulns = audit.vulnerabilities || {};
          for (const [name, item] of Object.entries(vulns)) {
            if (item.severity === 'critical' || item.severity === 'high') {
              console.log(`AUDIT_VULN ${name} severity=${item.severity} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`);
            }
          }
          NODE

      - name: Commit validated dependency upgrade
        shell: bash
        run: |
          rm .github/workflows/upgrade-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/upgrade-deps.yml
          git commit -m "security: upgrade framework and auth dependencies [deps-bot]"
          git push origin HEAD:hele-1.1-security-architecture
